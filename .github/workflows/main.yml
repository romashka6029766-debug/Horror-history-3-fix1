name: Build Android APK (Horror Voice 3.0)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # Шаг 1: Распаковываем архив проекта
    - name: Unzip project
      run: |
        unzip -o *.zip || true

    # Шаг 2: Автоматически находим, куда распаковался проект
    - name: Find Project Root Directory
      id: find-dir
      run: |
        PROJECT_DIR=$(find . -name "settings.gradle.kts" -exec dirname {} \+ | head -n 1)
        if [ -z "$PROJECT_DIR" ]; then
          PROJECT_DIR=$(find . -name "settings.gradle" -exec dirname {} \+ | head -n 1)
        fi
        if [ -z "$PROJECT_DIR" ]; then
          PROJECT_DIR="."
        fi
        echo "Found project directory at: $PROJECT_DIR"
        echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

    # Шаг 3: Создаем XML-интерфейс безопасным однострочным методом
    - name: Force Create Standard XML Layout
      run: |
        RES_DIR=$(find . -name "res" -type d | head -n 1)
        if [ -d "$RES_DIR" ]; then
          mkdir -p "$RES_DIR/layout"
          echo '<?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://android.com" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:gravity="center" android:padding="16dp" android:background="#121212"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Horror Voice 3.0" android:textColor="#FF0000" android:textSize="28sp" android:layout_marginBottom="32dp"/><Button android:id="@+id/btn1" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Страшный призрак" android:layout_marginTop="8dp" android:layout_marginBottom="8dp"/><Button android:id="@+id/btn2" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Голос монстра" android:layout_marginTop="8dp" android:layout_marginBottom="8dp"/><Button android:id="@+id/btn3" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Эхо в подвале" android:layout_marginTop="8dp" android:layout_marginBottom="8dp"/></LinearLayout>' > "$RES_DIR/layout/activity_main.xml"
        else
          echo "No res directory found!"
        fi

    # Шаг 4: Переписываем MainActivity.kt безопасным однострочным методом
    - name: Force Overwrite MainActivity.kt with Standard Code
      run: |
        TARGET_FILE=$(find . -name "MainActivity.kt" | head -n 1)
        if [ -f "$TARGET_FILE" ]; then
          echo 'package com.horrorvoice.app' > "$TARGET_FILE"
          echo 'import android.os.Bundle' >> "$TARGET_FILE"
          echo 'import android.widget.Button' >> "$TARGET_FILE"
          echo 'import android.widget.Toast' >> "$TARGET_FILE"
          echo 'import androidx.appcompat.app.AppCompatActivity' >> "$TARGET_FILE"
          echo 'class MainActivity : AppCompatActivity() {' >> "$TARGET_FILE"
          echo '    override fun onCreate(savedInstanceState: Bundle?) {' >> "$TARGET_FILE"
          echo '        super.onCreate(savedInstanceState)' >> "$TARGET_FILE"
          echo '        try {' >> "$TARGET_FILE"
          echo '            val layoutId = resources.getIdentifier("activity_main", "layout", packageName)' >> "$TARGET_FILE"
          echo '            if (layoutId != 0) {' >> "$TARGET_FILE"
          echo '                setContentView(layoutId)' >> "$TARGET_FILE"
          echo '                val btn1Id = resources.getIdentifier("btn1", "id", packageName)' >> "$TARGET_FILE"
          echo '                if (btn1Id != 0) {' >> "$TARGET_FILE"
          echo '                    findViewById<Button>(btn1Id).setOnClickListener {' >> "$TARGET_FILE"
          echo '                        Toast.makeText(this, "Эффект Призрака запущен!", Toast.LENGTH_SHORT).show()' >> "$TARGET_FILE"
          echo '                    }' >> "$TARGET_FILE"
          echo '                }' >> "$TARGET_FILE"
          echo '            } else {' >> "$TARGET_FILE"
          echo '                setContentView(android.R.layout.activity_list_item)' >> "$TARGET_FILE"
          echo '            }' >> "$TARGET_FILE"
          echo '        } catch (e: Exception) {' >> "$TARGET_FILE"
          echo '            setContentView(android.R.layout.activity_list_item)' >> "$TARGET_FILE"
          echo '        }' >> "$TARGET_FILE"
          echo '    }' >> "$TARGET_FILE"
          echo '}' >> "$TARGET_FILE"
        else
          echo "MainActivity.kt not found!"
        fi

    # Шаг 5: Настройка сборщика Gradle 8.7
    - name: Validate and Setup Gradle
      run: |
        cd ${{ steps.find-dir.outputs.dir }}
        gradle wrapper --gradle-version 8.7
        chmod +x gradlew

    # Шаг 6: Финальная компиляция
    - name: Build Debug APK
      run: |
        cd ${{ steps.find-dir.outputs.dir }}
        ./gradlew assembleDebug -Pkotlin.jvm.target.validation.mode=ignore --no-daemon

    # Шаг 7: Сохранение готового APK
    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: horror-voice-3.0-apk
        path: |
          **/build/outputs/apk/debug/*-debug.apk
