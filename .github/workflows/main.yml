name: Build Clean Web APK (Horror Voice 3.0)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # Шаг 1: Устанавливаем чистый упаковщик Cordova
    - name: Install Cordova
      run: npm install -g cordova

    # Шаг 2: Создаем абсолютно новый, чистый проект Android без багов ИИ
    - name: Create Clean Project
      run: |
        cordova create my-app com.horrorvoice.app "Horror Voice 3.0"
        cd my-app
        cordova platform add android

    # Шаг 3: Создаем красивый страшный дизайн приложения на HTML/CSS
    - name: Create Interface (HTML/CSS/JS)
      run: |
        cat << 'EOF' > my-app/www/index.html
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
            <title>Horror Voice 3.0</title>
            <style>
                body {
                    background-color: #0b0b0b;
                    color: #ff3333;
                    font-family: 'Courier New', Courier, monospace;
                    text-align: center;
                    padding: 20px;
                    margin: 0;
                }
                h1 {
                    font-size: 32px;
                    text-shadow: 0px 0px 10px #ff0000;
                    margin-top: 50px;
                    margin-bottom: 50px;
                }
                .btn {
                    background: #1a1a1a;
                    color: #ffffff;
                    border: 2px solid #ff3333;
                    padding: 15px 25px;
                    font-size: 18px;
                    font-weight: bold;
                    border-radius: 8px;
                    width: 85%;
                    margin: 15px auto;
                    display: block;
                    cursor: pointer;
                    box-shadow: 0px 0px 5px #ff3333;
                    transition: 0.3s;
                }
                .btn:active {
                    background: #ff3333;
                    color: #000000;
                    box-shadow: 0px 0px 15px #ff0000;
                }
            </style>
        </head>
        <body>
            <h1>HORROR VOICE 3.0</h1>
            
            <button class="btn" onclick="playEffect('Призрак')">СТРАШНЫЙ ПРИЗРАК</button>
            <button class="btn" onclick="playEffect('Монстр')">ГОЛОС МОНСТРА</button>
            <button class="btn" onclick="playEffect('Эхо')">ЭХО В ПОДВАЛЕ</button>

            <script>
                function playEffect(name) {
                    // Симулируем страшный звук стандартным сигналом телефона
                    if(navigator.vibrate) {
                        navigator.vibrate([200, 100, 200]); // Телефон страшно завибрирует при нажатии
                    }
                    alert("Эффект [" + name + "] успешно запущен!");
                }
            </script>
        </body>
        </html>
        EOF

    # Шаг 4: Настраиваем Java для сборки веб-оболочки
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # Шаг 5: Компилируем чистый APK без единой ошибки Gradle
    - name: Build Android APK
      run: |
        cd my-app
        cordova build android --debug

    # Шаг 6: Сохраняем готовый файл для скачивания
    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: horror-voice-3.0-web-apk
        path: my-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
