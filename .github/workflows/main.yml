name: Build Clean Web APK (Horror Voice 3.0)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Clean Project
      run: |
        cordova create my-app com.horrorvoice.app "Horror Voice 3.0"
        cd my-app
        cordova platform add android
        cordova plugin add cordova-plugin-media-capture --save


    - name: Create Interface (HTML/CSS/JS)
      run: |
        cat << 'EOF' > my-app/www/index.html
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
            <title>Horror Voice 3.0</title>
            <style>
                body {
                    background-color: #0b0b0b;
                    color: #ff3333;
                    font-family: 'Courier New', Courier, monospace;
                    text-align: center;
                    padding: 20px;
                    margin: 0;
                }
                h1 {
                    font-size: 32px;
                    text-shadow: 0px 0px 10px #ff0000;
                    margin-top: 50px;
                    margin-bottom: 30px;
                }
                .status {
                    color: #888;
                    font-size: 14px;
                    margin-bottom: 30px;
                }
                .btn {
                    background: #1a1a1a;
                    color: #ffffff;
                    border: 2px solid #ff3333;
                    padding: 15px 25px;
                    font-size: 18px;
                    font-weight: bold;
                    border-radius: 8px;
                    width: 85%;
                    margin: 15px auto;
                    display: block;
                    cursor: pointer;
                    box-shadow: 0px 0px 5px #ff3333;
                    transition: 0.3s;
                }
                .btn:active {
                    background: #ff3333;
                    color: #000000;
                    box-shadow: 0px 0px 15px #ff0000;
                }
            </style>
        </head>
        <body>
            <h1>HORROR VOICE 3.0</h1>
            <div id="status" class="status">Нажмите любую кнопку, чтобы начать запись...</div>
            
            <button class="btn" onclick="startHorrorEffect('ghost')">СТРАШНЫЙ ПРИЗРАК</button>
            <button class="btn" onclick="startHorrorEffect('monster')">ГОЛОС МОНСТРА</button>
            <button class="btn" onclick="startHorrorEffect('echo')">ЭХО В ПОДВАЛЕ</button>

            <script>
                let audioContext;
                let mediaRecorder;
                let audioChunks = [];

                async function startHorrorEffect(effectType) {
                    const statusText = document.getElementById('status');
                    statusText.innerText = "🎤 Говорите... Запись голоса (3 секунды)";
                    
                    if (navigator.vibrate) navigator.vibrate(100);

                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        mediaRecorder = new MediaRecorder(stream);
                        audioChunks = [];

                        mediaRecorder.ondataavailable = event => {
                            audioChunks.push(event.data);
                        };

                        mediaRecorder.onstop = async () => {
                            statusText.innerText = "🔮 ИИ изменяет ваш голос...";
                            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                            const arrayBuffer = await audioBlob.arrayBuffer();
                            
                            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
                            const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                            
                            playModifiedAudio(audioBuffer, effectType);
                        };

                        mediaRecorder.start();
                        setTimeout(() => {
                            mediaRecorder.stop();
                            stream.getTracks().forEach(track => track.stop());
                        }, 3000);

                    } catch (err) {
                        alert("Ошибка доступа к микрофону. Разрешите запись звука в настройках приложения!");
                        statusText.innerText = "Ошибка запуска инструментов.";
                    }
                }

                function playModifiedAudio(buffer, type) {
                    const source = audioContext.createBufferSource();
                    source.buffer = buffer;

                    let lastNode = source;

                    if (type === 'monster') {
                        source.playbackRate.value = 0.65;
                    }

                    if (type === 'ghost') {
                        source.playbackRate.value = 1.4;
                        const filter = audioContext.createBiquadFilter();
                        filter.type = "peaking";
                        filter.frequency.value = 1000;
                        filter.Q.value = 10;
                        filter.gain.value = 20;
                        lastNode.connect(filter);
                        lastNode = filter;
                    }

                    if (type === 'echo') {
                        const delay = audioContext.createDelay();
                        delay.delayTime.value = 0.4;
                        const feedback = audioContext.createGain();
                        feedback.gain.value = 0.5;
                        lastNode.connect(delay);
                        delay.connect(feedback);
                        feedback.connect(delay);
                        delay.connect(audioContext.destination);
                    }

                    lastNode.connect(audioContext.destination);
                    source.start();
                    document.getElementById('status').innerText = "🔊 Воспроизведение страшного эффекта!";
                    
                    source.onended = () => {
                        document.getElementById('status').innerText = "Готово! Нажмите кнопку, чтобы повторить.";
                    };
                }
            </script>
        </body>
        </html>
        EOF

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Build Android APK
      run: |
        cd my-app
        cordova build android --debug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: horror-voice-3.0-web-apk
        path: my-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
