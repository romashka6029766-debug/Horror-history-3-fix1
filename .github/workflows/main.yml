name: Build Android APK (Horror Voice 3.0)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # Шаг 1: Распаковываем архив
    - name: Unzip project
      run: |
        unzip -o *.zip || true

    # Шаг 2: Автоматически находим, куда распаковался проект
    - name: Find Project Root Directory
      id: find-dir
      run: |
        PROJECT_DIR=$(find . -name "settings.gradle.kts" -exec dirname {} \+ | head -n 1)
        if [ -z "$PROJECT_DIR" ]; then
          PROJECT_DIR=$(find . -name "settings.gradle" -exec dirname {} \+ | head -n 1)
        fi
        if [ -z "$PROJECT_DIR" ]; then
          PROJECT_DIR="."
        fi
        echo "Found project directory at: $PROJECT_DIR"
        echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

    # Шаг 3: АВТО-ИСПРАВЛЕНИЕ ОШИБОК CHATGPT В КОДЕ KOTLIN
    # Этот шаг сам допишет букву 'f' к числам и исправит ошибку с padding
    - name: Auto-fix ChatGPT Code Errors
      run: |
        TARGET_FILE=$(find . -name "MainActivity.kt" | head -n 1)
        if [ -f "$TARGET_FILE" ]; then
          echo "Fixing bugs in $TARGET_FILE..."
          # Добавляем импорт Modifier для поддержки отступов, если ИИ его забыл
          sed -i '1s/^/import androidx.compose.ui.Modifier\nimport androidx.compose.foundation.layout.padding\n/' "$TARGET_FILE"
          # Заменяем целые числа на Float во всех ошибочных строках (добавляем f)
          sed -i 's/fontSize = \([0-9]\+\)/fontSize = \1.0f/g' "$TARGET_FILE"
          sed -i 's/lineHeight = \([0-9]\+\)/lineHeight = \1.0f/g' "$TARGET_FILE"
          # Исправляем вызовы числовых литералов для Float
          sed -i 's/\([0-9]\+\) / \1f /g' "$TARGET_FILE" || true
        fi

    # Шаг 4: Настройка сборщика Gradle 8.7
    - name: Validate and Setup Gradle
      run: |
        cd ${{ steps.find-dir.outputs.dir }}
        gradle wrapper --gradle-version 8.7
        chmod +x gradlew

    # Шаг 5: Компиляция приложения с игнорированием мелких предупреждений
    - name: Build Debug APK
      run: |
        cd ${{ steps.find-dir.outputs.dir }}
        ./gradlew assembleDebug -Pkotlin.jvm.target.validation.mode=ignore --no-daemon

    # Шаг 6: Сохранение готового APK
    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: horror-voice-3.0-apk
        path: |
          **/build/outputs/apk/debug/*-debug.apk
