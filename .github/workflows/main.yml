name: Build Clean Web APK (Horror Voice 3.0)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Clean Project
      run: |
        cordova create my-app com.horrorvoice.app "Horror Voice 3.0"
        cd my-app
        cordova platform add android
        # Включаем безопасную схему HTTPS для полной разблокировки микрофона в WebView
        sed -i 's/<content src="index.html" \/>/<content src="index.html" \/>\n    <preference name="AndroidScheme" value="https" \/>/' config.xml

    - name: Create Interface (HTML/CSS/JS)
      run: |
        cat << 'EOF' > my-app/www/index.html
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
            <title>Horror Voice 3.0</title>
            <style>
                body {
                    background-color: #0b0b0b;
                    color: #ff3333;
                    font-family: 'Courier New', Courier, monospace;
                    text-align: center;
                    padding: 20px;
                    margin: 0;
                }
                h1 {
                    font-size: 32px;
                    text-shadow: 0px 0px 10px #ff0000;
                    margin-top: 50px;
                    margin-bottom: 30px;
                }
                .status {
                    color: #888;
                    font-size: 14px;
                    margin-bottom: 30px;
                }
                .btn {
                    background: #1a1a1a;
                    color: #ffffff;
                    border: 2px solid #ff3333;
                    padding: 15px 25px;
                    font-size: 18px;
                    font-weight: bold;
                    border-radius: 8px;
                    width: 85%;
                    margin: 15px auto;
                    display: block;
                    cursor: pointer;
                    box-shadow: 0px 0px 5px #ff3333;
                    transition: 0.3s;
                }
                .btn:active {
                    background: #ff3333;
                    color: #000000;
                    box-shadow: 0px 0px 15px #ff0000;
                }
            </style>
        </head>
        <body>
            <h1>HORROR VOICE 3.0</h1>
            <div id="status" class="status">Нажмите кнопку, чтобы начать запись...</div>
            
            <button class="btn" onclick="startHorrorEffect('ghost')">СТРАШНЫЙ ПРИЗРАК</button>
            <button class="btn" onclick="startHorrorEffect('monster')">ГОЛОС МОНСТРА</button>
            <button class="btn" onclick="startHorrorEffect('echo')">ЭХО В ПОДВАЛЕ</button>

            <script>
                let audioContext;
                let mediaRecorder;
                let audioChunks = [];

                async function startHorrorEffect(effectType) {
                    const statusText = document.getElementById('status');
                    statusText.innerText = "🎤 Говорите... Идет запись (3 секунды)";
                    
                    if (navigator.vibrate) navigator.vibrate(100);

                    try {
                        // Запрашиваем микрофон напрямую через браузерный движок
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        
                        // Используем стандартный MediaRecorder для записи чистого потока
                        mediaRecorder = new MediaRecorder(stream);
                        audioChunks = [];

                        mediaRecorder.ondataavailable = event => {
                            audioChunks.push(event.data);
                        };

                        mediaRecorder.onstop = async () => {
                            statusText.innerText = "🔮 ИИ изменяет ваш голос...";
                            
                            // Собираем аудио в Blob и переводим в формат понятный звуковой карте
                            const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
                            const arrayBuffer = await audioBlob.arrayBuffer();
                            
                            if (!audioContext) {
                                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                            }
                            
                            // Декодируем аудио в чистые частоты
                            audioContext.decodeAudioData(arrayBuffer, (audioBuffer) => {
                                playWithWebAudioEffects(audioBuffer, effectType);
                            }, (err) => {
                                statusText.innerText = "Ошибка декодирования звука.";
                                console.error(err);
                            });
                        };

                        mediaRecorder.start();

                        // Ровно через 3 секунды останавливаем запись
                        setTimeout(() => {
                            mediaRecorder.stop();
                            stream.getTracks().forEach(track => track.stop());
                        }, 3000);

                    } catch (err) {
                        statusText.innerText = "Ошибка. Включите доступ к микрофону в настройках планшета.";
                    }
                }

                function playWithWebAudioEffects(buffer, type) {
                    const source = audioContext.createBufferSource();
                    source.buffer = buffer;
                    let lastNode = source;

                    // ЭФФЕКТ 1: ГОЛОС МОНСТРА (Жесткое занижение тона)
                    if (type === 'monster') {
                        source.playbackRate.value = 0.6; // Замедляем и опускаем бас
                        
                        // Добавляем низкочастотный фильтр для жуткого гула
                        const lowpass = audioContext.createBiquadFilter();
                        lowpass.type = "lowpass";
                        lowpass.frequency.value = 800;
                        lastNode.connect(lowpass);
                        lastNode = lowpass;
                    }

                    // ЭФФЕКТ 2: СТРАШНЫЙ ПРИЗРАК (Завышение частоты + вибрация)
                    if (type === 'ghost') {
                        source.playbackRate.value = 1.4; // Ускоряем тон
                        
                        const highpass = audioContext.createBiquadFilter();
                        highpass.type = "highpass";
                        highpass.frequency.value = 1500;
                        lastNode.connect(highpass);
                        lastNode = highpass;
                    }

                    // ЭФФЕКТ 3: ЭХО В ПОДВАЛЕ (Полноценная задержка Delay)
                    if (type === 'echo') {
                        const delay = audioContext.createDelay();
                        delay.delayTime.value = 0.35; // Время эха

                        const feedback = audioContext.createGain();
                        feedback.gain.value = 0.4; // Затухание эха

                        lastNode.connect(delay);
                        delay.connect(feedback);
                        feedback.connect(delay); 
                        
                        delay.connect(audioContext.destination);
                    }

                    // Направляем звук в динамики устройства
                    lastNode.connect(audioContext.destination);
                    source.start(0);
                    
                    document.getElementById('status').innerText = "🔊 Воспроизведение страшного эффекта!";
                    
                    source.onended = () => {
                        document.getElementById('status').innerText = "Готово! Нажмите кнопку для повтора.";
                    };
                }
            </script>
        </body>
        </html>
        EOF

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Build Android APK
      run: |
        cd my-app
        cordova build android --debug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: horror-voice-3.0-web-apk
        path: my-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
