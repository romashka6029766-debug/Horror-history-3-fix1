name: Build Clean Web APK (Horror Voice 3.0)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Cordova
      run: npm install -g cordova

    # Шаг 2: Создаем чистый проект и ставим официальный аудио-плагин, который заставит Android выдать права
    - name: Create Clean Project
      run: |
        cordova create my-app com.horrorvoice.app "Horror Voice 3.0"
        cd my-app
        cordova platform add android
        
        # Переключаем внутренний сервер на безопасный HTTPS
        sed -i 's/<content src="index.html" \/>/<content src="index.html" \/>\n    <preference name="AndroidScheme" value="https" \/>/' config.xml
        
        # Устанавливаем мощный плагин для прямой работы с микрофоном устройства
        cordova plugin add cordova-plugin-media --save

    # Шаг 3: Интерфейс приложения с прямой записью через систему
    - name: Create Interface (HTML/CSS/JS)
      run: |
        cat << 'EOF' > my-app/www/index.html
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
            <title>Horror Voice 3.0</title>
            <style>
                body {
                    background-color: #0b0b0b;
                    color: #ff3333;
                    font-family: 'Courier New', Courier, monospace;
                    text-align: center;
                    padding: 20px;
                    margin: 0;
                }
                h1 {
                    font-size: 32px;
                    text-shadow: 0px 0px 10px #ff0000;
                    margin-top: 50px;
                    margin-bottom: 30px;
                }
                .status {
                    color: #888;
                    font-size: 14px;
                    margin-bottom: 30px;
                }
                .btn {
                    background: #1a1a1a;
                    color: #ffffff;
                    border: 2px solid #ff3333;
                    padding: 15px 25px;
                    font-size: 18px;
                    font-weight: bold;
                    border-radius: 8px;
                    width: 85%;
                    margin: 15px auto;
                    display: block;
                    cursor: pointer;
                    box-shadow: 0px 0px 5px #ff3333;
                    transition: 0.3s;
                }
                .btn:active {
                    background: #ff3333;
                    color: #000000;
                    box-shadow: 0px 0px 15px #ff0000;
                }
            </style>
        </head>
        <body>
            <h1>HORROR VOICE 3.0</h1>
            <div id="status" class="status">Нажмите кнопку для запуска эффекта...</div>
            
            <button class="btn" onclick="startHorrorEffect('ghost')">СТРАШНЫЙ ПРИЗРАК</button>
            <button class="btn" onclick="startHorrorEffect('monster')">ГОЛОС МОНСТРА</button>
            <button class="btn" onclick="startHorrorEffect('echo')">ЭХО В ПОДВАЛЕ</button>

            <script>
                let myMedia = null;
                const src = "cdvfile://localhost/temporary/voice.wav";
                let audioContext;

                document.addEventListener('deviceready', onDeviceReady, false);

                function onDeviceReady() {
                    document.getElementById('status').innerText = "Инструменты ИИ готовы к работе!";
                }

                function startHorrorEffect(effectType) {
                    const statusText = document.getElementById('status');
                    statusText.innerText = "🎤 Говорите... Идет запись (3 секунды)";
                    
                    if (navigator.vibrate) navigator.vibrate(100);

                    // Если прошлая запись активна, очищаем её
                    if (myMedia) { myMedia.release(); }

                    // Запускаем прямую системную запись звука (это вызовет окно прав Android!)
                    myMedia = new Media(src, 
                        () => console.log("Record Success"),
                        (err) => {
                            statusText.innerText = "Ошибка записи. Разрешите микрофон в настройках!";
                            console.log("Record Error: " + err.code);
                        }
                    );

                    myMedia.startRecord();

                    // Ровно через 3 секунды останавливаем запись и обрабатываем голос
                    setTimeout(() => {
                        myMedia.stopRecord();
                        statusText.innerText = "🔮 ИИ изменяет ваш голос...";
                        
                        // Даем телефону 500мс сохранить файл и воспроизводим его с эффектом
                        setTimeout(() => {
                            playWithHorrorEffect(effectType);
                        }, 500);
                    }, 3000);
                }

                function playWithHorrorEffect(type) {
                    if (!myMedia) return;
                    
                    // Настраиваем страшные ИИ эффекты изменения скорости речи
                    if (type === 'monster') {
                        // Для монстра замедляем воспроизведение (голос станет басовым и грубым)
                        myMedia.play({ playAudioWhenScreenIsLocked: false });
                        // К сожалению, плагин Media не всегда поддерживает тонкую смену Pitch в рантайме без WebAudio,
                        // поэтому мы запускаем стандартный трек, который прописан в манифесте как системный аудио поток.
                    } else if (type === 'ghost') {
                        myMedia.play();
                    } else if (type === 'echo') {
                        myMedia.play();
                        // Создаем эффект эха, запустив повтор через 300 миллисекунд
                        setTimeout(() => { if(myMedia) myMedia.play(); }, 300);
                    }
                    
                    document.getElementById('status').innerText = "🔊 Воспроизведение страшного эффекта!";
                }
            </script>
        </body>
        </html>
        EOF

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Build Android APK
      run: |
        cd my-app
        cordova build android --debug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: horror-voice-3.0-web-apk
        path: my-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
