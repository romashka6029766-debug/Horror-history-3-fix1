name: Build Clean Web APK (Horror Voice 3.0)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Clean Project
      run: |
        cordova create my-app com.horrorvoice.app "Horror Voice 3.0"
        cd my-app
        cordova platform add android

    - name: Create Interface (HTML/CSS/JS)
      run: |
        cat << 'EOF' > my-app/www/index.html
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
            <title>Horror Voice 3.0</title>
            <style>
                body {
                    background-color: #0b0b0b;
                    color: #ff3333;
                    font-family: 'Courier New', Courier, monospace;
                    text-align: center;
                    padding: 20px;
                    margin: 0;
                }
                h1 {
                    font-size: 32px;
                    text-shadow: 0px 0px 10px #ff0000;
                    margin-top: 50px;
                    margin-bottom: 30px;
                }
                .status {
                    color: #888;
                    font-size: 14px;
                    margin-bottom: 30px;
                }
                .btn {
                    background: #1a1a1a;
                    color: #ffffff;
                    border: 2px solid #ff3333;
                    padding: 15px 25px;
                    font-size: 18px;
                    font-weight: bold;
                    border-radius: 8px;
                    width: 85%;
                    margin: 15px auto;
                    display: block;
                    cursor: pointer;
                    box-shadow: 0px 0px 5px #ff3333;
                    transition: 0.3s;
                }
                .btn:active {
                    background: #ff3333;
                    color: #000000;
                    box-shadow: 0px 0px 15px #ff0000;
                }
            </style>
        </head>
        <body>
            <h1>HORROR VOICE 3.0</h1>
            <div id="status" class="status">ИИ-синтезатор звуков готов. Нажмите кнопку!</div>
            
            <button class="btn" onclick="generateHorrorSound('ghost')">СТРАШНЫЙ ПРИЗРАК</button>
            <button class="btn" onclick="generateHorrorSound('monster')">ГОЛОС МОНСТРА</button>
            <button class="btn" onclick="generateHorrorSound('echo')">ЭХО В ПОДВАЛЕ</button>

            <script>
                let audioCtx = null;

                function initAudio() {
                    if (!audioCtx) {
                        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    }
                }

                function generateHorrorSound(type) {
                    initAudio();
                    const statusText = document.getElementById('status');
                    
                    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

                    // Создаем главный осциллятор (генератор звуковых волн)
                    const osc = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    
                    osc.connect(gainNode);
                    gainNode.connect(audioCtx.destination);

                    const now = audioCtx.currentTime;

                    // ИНСТРУМЕНТ 1: ПОТУСТОРОННИЙ ПРИЗРАК (Дрожащий, завывающий свист)
                    if (type === 'ghost') {
                        statusText.innerText = "👻 Звучит потусторонний призрак...";
                        osc.type = 'sine';
                        // Заставляем частоту жутко прыгать вверх и вниз (эффект воя)
                        osc.frequency.setValueAtTime(400, now);
                        osc.frequency.linearRampToValueAtTime(800, now + 0.5);
                        osc.frequency.linearRampToValueAtTime(300, now + 1.0);
                        osc.frequency.linearRampToValueAtTime(600, now + 1.5);
                        
                        // Плавное затухание звука
                        gainNode.gain.setValueAtTime(0.3, now);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 1.8);
                        
                        osc.start(now);
                        osc.stop(now + 1.8);
                    }

                    // ИНСТРУМЕНТ 2: РЫК МОНСТРА (Ужасный, тяжелый низкочастотный гул)
                    if (type === 'monster') {
                        statusText.innerText = "👹 Слышен зловещий рык монстра...";
                        osc.type = 'sawtooth'; // Пилообразная волна для агрессивного звука
                        
                        osc.frequency.setValueAtTime(80, now);
                        osc.frequency.linearRampToValueAtTime(50, now + 0.4);
                        osc.frequency.linearRampToValueAtTime(60, now + 0.8);
                        osc.frequency.linearRampToValueAtTime(40, now + 1.5);

                        // Добавляем эффект хрипа (модуляцию частоты)
                        const modulator = audioCtx.createOscillator();
                        const modGain = audioCtx.createGain();
                        modulator.type = 'square';
                        modulator.frequency.value = 35; // Частота хрипения
                        modGain.gain.value = 25;

                        modulator.connect(modGain);
                        modGain.connect(osc.frequency);
                        
                        gainNode.gain.setValueAtTime(0.4, now);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 1.6);
                        
                        modulator.start(now);
                        osc.start(now);
                        modulator.stop(now + 1.6);
                        osc.stop(now + 1.6);
                    }

                    // ИНСТРУМЕНТ 3: ЭХО В ПОДВАЛЕ (Пугающие капли или удары с затуханием)
                    if (type === 'echo') {
                        statusText.innerText = "⛓️ Гулкие шаги и эхо в подвале...";
                        osc.type = 'triangle';
                        
                        // Генерируем 3 последовательных удара с эффектом эха
                        [0, 0.4, 0.8].forEach((delayTime, index) => {
                            const echoOsc = audioCtx.createOscillator();
                            const echoGain = audioCtx.createGain();
                            
                            echoOsc.type = 'triangle';
                            echoOsc.frequency.setValueAtTime(150 - (index * 30), now + delayTime);
                            echoOsc.frequency.exponentialRampToValueAtTime(40, now + delayTime + 0.2);
                            
                            // Каждый следующий повтор эха тише предыдущего
                            echoGain.gain.setValueAtTime(0.4 / (index + 1), now + delayTime);
                            echoGain.gain.exponentialRampToValueAtTime(0.01, now + delayTime + 0.3);
                            
                            echoOsc.connect(echoGain);
                            echoGain.connect(audioCtx.destination);
                            
                            echoOsc.start(now + delayTime);
                            echoOsc.stop(now + delayTime + 0.3);
                        });
                    }
                }
            </script>
        </body>
        </html>
        EOF

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Build Android APK
      run: |
        cd my-app
        cordova build android --debug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: horror-voice-3.0-web-apk
        path: my-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
