name: Build Android APK (Horror Voice 3.0)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # Распаковываем чистый архив проекта (без наших прошлых поломок текста)
    - name: Unzip project
      run: |
        unzip -o *.zip || true

    # Находим корневую папку проекта
    - name: Find Project Root Directory
      id: find-dir
      run: |
        PROJECT_DIR=$(find . -name "settings.gradle.kts" -exec dirname {} \+ | head -n 1)
        if [ -z "$PROJECT_DIR" ]; then
          PROJECT_DIR=$(find . -name "settings.gradle" -exec dirname {} \+ | head -n 1)
        fi
        if [ -z "$PROJECT_DIR" ]; then
          PROJECT_DIR="."
        fi
        echo "Found project directory at: $PROJECT_DIR"
        echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

    # Настраиваем Gradle 8.7
    - name: Validate and Setup Gradle
      run: |
        cd ${{ steps.find-dir.outputs.dir }}
        gradle wrapper --gradle-version 8.7
        chmod +x gradlew

    # Собираем APK с флагами отключения строгой валидации
    - name: Build Debug APK
      run: |
        cd ${{ steps.find-dir.outputs.dir }}
        ./gradlew assembleDebug -Pkotlin.jvm.target.validation.mode=ignore -Pandroid.experimental.internal.suppressSourceCompatibilityCheck=true --no-daemon

    # Сохраняем готовый файл
    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: horror-voice-3.0-apk
        path: |
          **/build/outputs/apk/debug/*-debug.apk
