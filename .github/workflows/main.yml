name: Build Clean Web APK (Horror Voice 3.0)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Clean Project
      run: |
        cordova create my-app com.horrorvoice.app "Horror Voice 3.0"
        cd my-app
        cordova platform add android
        # Включаем безопасную схему HTTPS для полной разблокировки микрофона в WebView
        sed -i 's/<content src="index.html" \/>/<content src="index.html" \/>\n    <preference name="AndroidScheme" value="https" \/>/' config.xml

    - name: Create Interface (HTML/CSS/JS)
      run: |
        cat << 'EOF' > my-app/www/index.html
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
            <title>Horror Voice 3.0</title>
            <style>
                body {
                    background-color: #0b0b0b;
                    color: #ff3333;
                    font-family: 'Courier New', Courier, monospace;
                    text-align: center;
                    padding: 20px;
                    margin: 0;
                }
                h1 {
                    font-size: 32px;
                    text-shadow: 0px 0px 10px #ff0000;
                    margin-top: 50px;
                    margin-bottom: 30px;
                }
                .status {
                    color: #888;
                    font-size: 14px;
                    margin-bottom: 30px;
                }
                .btn {
                    background: #1a1a1a;
                    color: #ffffff;
                    border: 2px solid #ff3333;
                    padding: 15px 25px;
                    font-size: 18px;
                    font-weight: bold;
                    border-radius: 8px;
                    width: 85%;
                    margin: 15px auto;
                    display: block;
                    cursor: pointer;
                    box-shadow: 0px 0px 5px #ff3333;
                    transition: 0.3s;
                }
                .btn:active {
                    background: #ff3333;
                    color: #000000;
                    box-shadow: 0px 0px 15px #ff0000;
                }
                .save-box {
                    margin-top: 40px;
                    display: none;
                }
                .btn-save {
                    background: #0066cc;
                    border-color: #0088ff;
                    box-shadow: 0px 0px 5px #0088ff;
                }
            </style>
        </head>
        <body>
            <h1>HORROR VOICE 3.0</h1>
            <div id="status" class="status">Нажмите любую кнопку, чтобы записать и изменить свой голос...</div>
            
            <button class="btn" onclick="startRecording('ghost')">СТРАШНЫЙ ПРИЗРАК</button>
            <button class="btn" onclick="startRecording('monster')">ГОЛОС МОНСТРА</button>
            <button class="btn" onclick="startRecording('echo')">ЭХО В ПОДВАЛЕ</button>

            <!-- Блок экспорта файла для CapCut -->
            <div id="saveBox" class="save-box">
                <div class="status" style="color:#00ff00;">✨ Голос успешно изменен ИИ!</div>
                <button class="btn btn-save" onclick="downloadAudioForCapCut()">📥 СОХРАНИТЬ В ПЛАНШЕТ ДЛЯ CAPCUT</button>
            </div>

            <script>
                let audioContext;
                let mediaRecorder;
                let audioChunks = [];
                let finalAudioBlob = null;
                let currentEffect = '';

                async function startRecording(effectType) {
                    currentEffect = effectType;
                    const statusText = document.getElementById('status');
                    document.getElementById('saveBox').style.display = 'none';
                    statusText.innerText = "🎤 Говорите... Идет запись вашего голоса (4 секунды)";
                    
                    if (navigator.vibrate) navigator.vibrate(100);

                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        mediaRecorder = new MediaRecorder(stream);
                        audioChunks = [];

                        mediaRecorder.ondataavailable = event => { audioChunks.push(event.data); };

                        mediaRecorder.onstop = async () => {
                            statusText.innerText = "🔮 ИИ обрабатывает аудио-поток...";
                            
                            const rawBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
                            const arrayBuffer = await rawBlob.arrayBuffer();
                            
                            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
                            
                            audioContext.decodeAudioData(arrayBuffer, async (audioBuffer) => {
                                // Применяем эффекты изменения тона и генерируем новый измененный файл
                                processAndCreateFile(audioBuffer, effectType);
                            });
                        };

                        mediaRecorder.start();
                        setTimeout(() => {
                            mediaRecorder.stop();
                            stream.getTracks().forEach(track => track.stop());
                        }, 4000); // Пишем 4 секунды фразы

                    } catch (err) {
                        statusText.innerText = "Ошибка. Перейдите в настройки планшета и включите доступ к МИКРОФОНУ для Horror Voice!";
                    }
                }

                function processAndCreateFile(buffer, type) {
                    // Создаем офлайн-контекст для быстрой обработки и рендеринга файла в памяти
                    const offlineCtx = new OfflineAudioContext(buffer.numberOfChannels, buffer.length, buffer.sampleRate);
                    const source = offlineCtx.createBufferSource();
                    source.buffer = buffer;
                    let lastNode = source;

                    // Применяем наши ИИ-настройки к звуковой дорожке
                    if (type === 'monster') {
                        source.playbackRate.value = 0.65; // Делаем глубокий бас
                    } else if (type === 'ghost') {
                        source.playbackRate.value = 1.35; // Делаем потусторонний свист
                    } else if (type === 'echo') {
                        const delay = offlineCtx.createDelay();
                        delay.delayTime.value = 0.3;
                        const feedback = offlineCtx.createGain();
                        feedback.gain.value = 0.4;
                        lastNode.connect(delay);
                        delay.connect(feedback);
                        feedback.connect(delay);
                        delay.connect(offlineCtx.destination);
                    }

                    lastNode.connect(offlineCtx.destination);
                    source.start(0);

                    // Рендерим измененный звук в полноценный файл
                    offlineCtx.startRendering().then(renderedBuffer => {
                        // Переводим буфер в стандартный формат звукового файла WAV
                        finalAudioBlob = bufferToWav(renderedBuffer);
                        
                        document.getElementById('status').innerText = "🔊 Голос обработан! Нажмите синюю кнопку ниже для сохранения.";
                        document.getElementById('saveBox').style.display = 'block';
                        
                        // Сразу даем прослушать результат
                        playPreview(renderedBuffer);
                    });
                }

                function playPreview(audioBuffer) {
                    const playSource = audioContext.createBufferSource();
                    playSource.buffer = audioBuffer;
                    playSource.connect(audioContext.destination);
                    playSource.start(0);
                }

                function downloadAudioForCapCut() {
                    if (!finalAudioBlob) return;
                    
                    // Создаем временную ссылку на скачивание файла прямо в систему
                    const url = window.URL.createObjectURL(finalAudioBlob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = `horror_voice_${currentEffect}_${Date.now()}.wav`;
                    document.body.appendChild(a);
                    a.click();
                    
                    setTimeout(() => {
                        window.URL.revokeObjectURL(url);
                        document.getElementById('status').innerText = "✅ Файл сохранен в папку 'Загрузки'! Откройте его в CapCut.";
                    }, 100);
                }

                // Вспомогательная функция конвертации аудио-волн в настоящий файл .WAV
                function bufferToWav(buffer) {
                    let numOfChan = buffer.numberOfChannels,
                        length = buffer.length * numOfChan * 2 + 44,
                        bufferArr = new ArrayBuffer(length),
                        view = new DataView(bufferArr),
                        channels = [], i, sample,
                        offset = 0,
                        pos = 0;

                    function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
